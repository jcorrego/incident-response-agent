[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "incident-response-agent"
version = "0.1.0"
description = "Evidence-first incident response workflow with scoped tools, specialist subagents, and approval gates."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Juan Carlos Orrego Díaz"}]
keywords = ["ai-agents", "incident-response", "mcp", "observability", "agentic-workflows"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
incident-response-demo = "incident_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
